<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17324d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<title>BillTrack</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/js/main.js"></script>
</head>
<body>
<div id="auth" class="auth" hidden></div>

<div id="app" hidden>
  <header class="top">
    <h1 id="viewTitle">BillTrack</h1>
    <div class="top-actions">
      <span id="who" class="who"></span>
      <button id="bell" type="button" class="icon" aria-label="Alerts">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.4-2h-4.8A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.8V3a1.5 1.5 0 0 0-3 0v1.2A7 7 0 0 0 5 11v5l-2 2v1h18v-1Z"/></svg>
        <span id="bellCount" class="badge" hidden>0</span>
      </button>
      <button id="addBtn" class="primary" type="button">Add</button>
    </div>
  </header>
  <nav id="sidenav" class="sidenav" aria-label="Sections"></nav>
  <main id="view"></main>
  <nav id="tabs" class="tabs" aria-label="Sections"></nav>
</div>

<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
