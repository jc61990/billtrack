name: ci
on:
  push:
  pull_request:
  schedule: [{ cron: "0 12 * * 1" }]   # weekly CVE re-scan even with no commits
permissions:
  contents: read
jobs:
  test-and-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pytest httpx pip-audit
      - run: python -m pytest -q
      - run: pip-audit -r requirements.txt --strict

  frontend-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm i --no-save eslint@9 globals@15
      - run: npx eslint static/js static/sw.js    # fails on undefined names (the 3.5.1 Admin > Users bug)
